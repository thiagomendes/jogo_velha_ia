<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha IA - Ultra Moderno</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.05) 0%, transparent 50%);
            animation: backgroundShift 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes backgroundShift {
            0% { transform: translateX(-10px) translateY(-10px); }
            100% { transform: translateX(10px) translateY(10px); }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            animation: containerFloat 6s ease-in-out infinite alternate;
        }

        @keyframes containerFloat {
            0% { transform: translateY(-5px); }
            100% { transform: translateY(5px); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 400;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .cell:hover::before {
            left: 100%;
        }

        .cell:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .cell.player-move {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
            animation: playerPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cell.ai-move {
            color: #4ecdc4;
            text-shadow: 0 0 20px rgba(78, 205, 196, 0.8);
            animation: aiPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes playerPulse {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(90deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes aiPulse {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(-90deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .cell.winner {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            animation: winnerGlow 1s ease-in-out infinite alternate;
            color: #000;
            font-weight: 900;
        }

        @keyframes winnerGlow {
            0% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.8); }
            100% { box-shadow: 0 0 40px rgba(0, 255, 136, 1), 0 0 60px rgba(0, 204, 255, 0.8); }
        }

        .cell.loser {
            background: linear-gradient(45deg, #ff4757, #ff3838);
            animation: loserPulse 0.5s ease-in-out 3;
            color: #fff;
            font-weight: 900;
        }

        @keyframes loserPulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .status {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin: 20px 0;
            min-height: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .game-over-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .game-over-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: white;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .game-over-overlay.show .game-over-content {
            transform: scale(1);
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .cell {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="game-container">
        <div class="header">
            <h1>JOGO DA VELHA INTELIGENTE</h1>

        </div>

        <div class="game-board" id="gameBoard">
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
            <div class="cell" data-index="9"></div>
        </div>

        <div class="status" id="status">Sua vez! Clique em uma célula</div>

        <div class="controls">
            <button class="btn btn-primary" onclick="comecarNovamente()">
                Nova Partida
            </button>
            <button class="btn btn-secondary" onclick="zerarMemoria()">
                Zerar Memória
            </button>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-content">
            <h2 id="gameOverTitle">Fim de Jogo!</h2>
            <p id="gameOverMessage">Resultado da partida</p>
            <button class="btn btn-primary" onclick="comecarNovamente()" style="margin-top: 20px;">
                Jogar Novamente
            </button>
        </div>
    </div>

    <script>
        // Variáveis do jogo
        let jogador = [];
        let maquina = [];
        let acabou = false;
        let gameState = {};

        const possiveisVitorias = [
            ["1", "2", "3"], ["4", "5", "6"], ["7", "8", "9"],
            ["1", "5", "9"], ["1", "4", "7"], ["2", "5", "8"],
            ["3", "6", "9"], ["3", "5", "7"]
        ];

        let livres = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];

        // Criar partículas flutuantes
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (6 + Math.random() * 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Salvar jogada
        function saveMove(winner, loser) {
            try {
                let jogadas = JSON.parse(localStorage.getItem("jogadas")) || [];
                jogadas.push({ vencedor: winner, perdedor: loser });
                localStorage.setItem("jogadas", JSON.stringify(jogadas));
            } catch (e) {
                // Fallback para ambientes sem localStorage
                console.log('Jogada salva:', { vencedor: winner, perdedor: loser });
            }
        }

        // Zerar memória
        function zerarMemoria() {
            try {
                localStorage.removeItem("jogadas");
            } catch (e) {
                console.log('Memória zerada');
            }
            updateStatus("Memória zerada! Nova partida iniciada.");
            setTimeout(() => comecarNovamente(), 1500);
        }

        // Começar novamente
        function comecarNovamente() {
            jogador = [];
            maquina = [];
            acabou = false;
            livres = ["1", "2", "3", "4", "5", "6", "7", "8", "9"];
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
                cell.style.background = '';
                cell.style.color = '';
            });
            
            updateStatus("Sua vez! Clique em uma célula");
            hideGameOverOverlay();
        }

        // Atualizar status
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        // Mostrar overlay de fim de jogo
        function showGameOverOverlay(title, message) {
            document.getElementById('gameOverTitle').textContent = title;
            document.getElementById('gameOverMessage').textContent = message;
            document.getElementById('gameOverOverlay').classList.add('show');
        }

        // Esconder overlay de fim de jogo
        function hideGameOverOverlay() {
            document.getElementById('gameOverOverlay').classList.remove('show');
        }

        // Verificar se o jogador está prestes a ganhar
        function verificaSeJogadorEstaPelaBoa() {
            for (let i = 0; i < possiveisVitorias.length; i++) {
                const combinacao = possiveisVitorias[i];
                let count = 0;
                let celulaBloqueio = null;

                for (let j = 0; j < combinacao.length; j++) {
                    if (jogador.includes(combinacao[j])) {
                        count++;
                    } else if (!maquina.includes(combinacao[j])) {
                        celulaBloqueio = combinacao[j];
                    }
                }

                if (count === 2 && celulaBloqueio) {
                    return celulaBloqueio;
                }
            }
            return null;
        }

        // Verificar se a máquina pode ganhar
        function verificaSeIAPodeGanhar() {
            for (let i = 0; i < possiveisVitorias.length; i++) {
                const combinacao = possiveisVitorias[i];
                let count = 0;
                let celulaVitoria = null;

                for (let j = 0; j < combinacao.length; j++) {
                    if (maquina.includes(combinacao[j])) {
                        count++;
                    } else if (!jogador.includes(combinacao[j])) {
                        celulaVitoria = combinacao[j];
                    }
                }

                if (count === 2 && celulaVitoria) {
                    return celulaVitoria;
                }
            }
            return null;
        }

        // Jogada da máquina
        function jogadaMaquina() {
            if (acabou) return;

            setTimeout(() => {
                let escolha;
                
                // 1. Tentar ganhar
                escolha = verificaSeIAPodeGanhar();
                
                // 2. Bloquear jogador
                if (!escolha) {
                    escolha = verificaSeJogadorEstaPelaBoa();
                }
                
                // 3. Jogada estratégica
                if (!escolha) {
                    if (livres.includes("5")) {
                        escolha = "5"; // Centro
                    } else if (livres.some(pos => ["1", "3", "7", "9"].includes(pos))) {
                        const cantos = ["1", "3", "7", "9"].filter(pos => livres.includes(pos));
                        escolha = cantos[Math.floor(Math.random() * cantos.length)];
                    } else {
                        escolha = livres[Math.floor(Math.random() * livres.length)];
                    }
                }

                if (escolha && livres.includes(escolha)) {
                    maquina.push(escolha);
                    livres.splice(livres.indexOf(escolha), 1);
                    
                    const cell = document.querySelector(`[data-index="${escolha}"]`);
                    cell.textContent = '✕';
                    cell.classList.add('ai-move');
                    
                    verificaResultado();
                    
                    if (!acabou) {
                        updateStatus("Sua vez! Clique em uma célula");
                    }
                }
            }, 500);
        }

        // Jogada do jogador
        function jogadaJogador(cell) {
            if (acabou) return;
            
            const index = cell.getAttribute('data-index');
            
            if (!jogador.includes(index) && !maquina.includes(index)) {
                jogador.push(index);
                livres.splice(livres.indexOf(index), 1);
                
                cell.textContent = '○';
                cell.classList.add('player-move');
                
                updateStatus("IA está pensando...");
                verificaResultado();
                
                if (!acabou) {
                    jogadaMaquina();
                }
            }
        }

        // Verificar resultado do jogo
        function verificaResultado() {
            // Verificar vitória do jogador
            for (let i = 0; i < possiveisVitorias.length; i++) {
                const combinacao = possiveisVitorias[i];
                if (combinacao.every(pos => jogador.includes(pos))) {
                    marcarVencedor(combinacao, 'winner');
                    updateStatus("🎉 Você ganhou!");
                    showGameOverOverlay("🎉 Vitória!", "Parabéns! Você derrotou a IA!");
                    saveMove(jogador, maquina);
                    acabou = true;
                    return;
                }
            }

            // Verificar vitória da IA
            for (let i = 0; i < possiveisVitorias.length; i++) {
                const combinacao = possiveisVitorias[i];
                if (combinacao.every(pos => maquina.includes(pos))) {
                    marcarVencedor(combinacao, 'loser');
                    updateStatus("🤖 IA ganhou!");
                    showGameOverOverlay("🤖 IA Venceu!", "A inteligência artificial foi superior desta vez!");
                    saveMove(maquina, jogador);
                    acabou = true;
                    return;
                }
            }

            // Verificar empate
            if (livres.length === 0) {
                updateStatus("🤝 Empate!");
                showGameOverOverlay("🤝 Empate!", "Que partida equilibrada! Ninguém ganhou desta vez.");
                acabou = true;
            }
        }

        // Marcar células vencedoras
        function marcarVencedor(combinacao, classe) {
            combinacao.forEach(pos => {
                const cell = document.querySelector(`[data-index="${pos}"]`);
                cell.classList.add(classe);
            });
        }

        // Inicializar o jogo
        function inicializarJogo() {
            createParticles();
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.addEventListener('click', () => jogadaJogador(cell));
            });
            
            updateStatus("Sua vez! Clique em uma célula");
        }

        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', inicializarJogo);
    </script>
</body>
</html>
